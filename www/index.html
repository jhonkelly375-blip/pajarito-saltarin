<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#83d8ff">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pajarito Saltarín">
<title>Pajarito Saltarín</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(#b8eeff,#e8fbff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#16324a}.wrap{width:min(94vw,440px);text-align:center;padding:14px}.title{margin:0 0 8px;font-size:clamp(25px,7vw,36px);color:#125a85}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 4px;font-weight:800;font-size:18px}.game{position:relative;width:100%;border:5px solid white;border-radius:22px;overflow:hidden;box-shadow:0 12px 32px #2176a533;background:#82dcff;touch-action:manipulation}canvas{display:block;width:100%;height:auto;aspect-ratio:360/560}.hint{margin:12px 4px 4px;color:#31536a;font-size:15px}.btn{border:0;border-radius:999px;background:#ffbf42;color:#573700;font-weight:900;font-size:18px;padding:12px 24px;box-shadow:0 4px 0 #e39720;cursor:pointer}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #e39720}.overlay{position:absolute;inset:0;display:grid;place-content:center;gap:12px;background:#17345155;color:white;padding:24px;text-shadow:0 2px 4px #16324a;text-align:center}.overlay h2{font-size:32px;margin:0}.overlay p{font-size:17px;margin:0}.hidden{display:none}.small{font-size:13px;color:#5d7b8d;margin-top:14px}
</style>
</head>
<body><main class="wrap">
<h1 class="title">🐤 Pajarito Saltarín</h1>
<div class="top"><span>⭐ Puntos: <b id="score">0</b></span><span>🏆 Récord: <b id="best">0</b></span></div>
<div class="game"><canvas id="game" width="360" height="560" aria-label="Juego del pajarito saltarín"></canvas>
<div class="overlay" id="overlay"><h2>¡A volar! 🐤</h2><p>Toca la pantalla o pulsa espacio para saltar y esquivar los tubos.</p><button class="btn" id="start">Jugar</button></div></div>
<p class="hint">Toca la pantalla o pulsa <b>espacio</b> para dar un saltito.</p><p class="small">Hecho para jugar también en el celular.</p>
</main>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),start=document.getElementById('start');
let bird,pipes,score,best=Number(localStorage.getItem('birdBest')||0),running=false,started=false,frame=0,raf;
bestEl.textContent=best;
function reset(){bird={x:92,y:250,vy:0,r:16};pipes=[];score=0;frame=0;scoreEl.textContent=0;for(let x=260;x<900;x+=190)addPipe(x);}
function addPipe(x){let gap=158,top=70+Math.random()*220;pipes.push({x,top,gap,passed:false});}
function draw(){let g=ctx.createLinearGradient(0,0,0,560);g.addColorStop(0,'#75d5ff');g.addColorStop(1,'#d1f5ff');ctx.fillStyle=g;ctx.fillRect(0,0,360,560);
// clouds
ctx.fillStyle='#ffffffaa';for(const [x,y,s] of [[54,85,1],[248,132,.8],[180,45,.6]]){ctx.beginPath();ctx.arc(x,y,19*s,0,7);ctx.arc(x+20*s,y-7*s,23*s,0,7);ctx.arc(x+43*s,y,17*s,0,7);ctx.fill();}
// distant hills
ctx.fillStyle='#9fe3a5';ctx.beginPath();ctx.moveTo(0,455);ctx.quadraticCurveTo(90,380,180,455);ctx.quadraticCurveTo(270,375,360,450);ctx.lineTo(360,560);ctx.lineTo(0,560);ctx.fill();
// pipes
for(const p of pipes){ctx.fillStyle='#20a957';ctx.strokeStyle='#11743d';ctx.lineWidth=3;let bottomY=p.top+p.gap;ctx.fillRect(p.x,0,48,p.top);ctx.strokeRect(p.x,0,48,p.top);ctx.fillRect(p.x-5,p.top-22,58,22);ctx.strokeRect(p.x-5,p.top-22,58,22);ctx.fillRect(p.x,bottomY,48,560-bottomY);ctx.strokeRect(p.x,bottomY,48,560-bottomY);ctx.fillRect(p.x-5,bottomY,58,22);ctx.strokeRect(p.x-5,bottomY,58,22);}
// ground
ctx.fillStyle='#f4d17b';ctx.fillRect(0,520,360,40);ctx.fillStyle='#65c94d';ctx.fillRect(0,514,360,12);ctx.fillStyle='#d9ae54';for(let x=-((frame*2)%24);x<380;x+=24)ctx.fillRect(x,530,12,4);
// bird
ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-.35,Math.min(.8,bird.vy*.045)));ctx.fillStyle='#ffd33d';ctx.strokeStyle='#a56619';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,18,15,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#ffad33';ctx.beginPath();ctx.ellipse(-6,5,9,6,Math.sin(frame/5)*.25,0,7);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(8,-5,5,0,7);ctx.fill();ctx.fillStyle='#17212b';ctx.beginPath();ctx.arc(10,-5,2,0,7);ctx.fill();ctx.fillStyle='#ff7945';ctx.beginPath();ctx.moveTo(15,1);ctx.lineTo(27,5);ctx.lineTo(15,9);ctx.fill();ctx.restore();
}
function flap(){if(!started){begin();return}if(running)bird.vy=-6.3;}
function begin(){reset();started=true;running=true;overlay.classList.add('hidden');tick();}
function end(){running=false;started=false;best=Math.max(best,score);localStorage.setItem('birdBest',best);bestEl.textContent=best;overlay.innerHTML='<h2>¡Pío! 💫</h2><p>Hiciste <b>'+score+'</b> punto'+(score===1?'':'s')+'. ¿Intentamos otra vez?</p><button class="btn" id="restart">Jugar de nuevo</button>';overlay.classList.remove('hidden');document.getElementById('restart').addEventListener('click',begin);draw();}
function tick(){if(!running)return;frame++;bird.vy+=.34;bird.y+=bird.vy;for(const p of pipes)p.x-=2.35;if(pipes.length&&pipes[0].x<-65){pipes.shift();addPipe(pipes[pipes.length-1].x+190);}for(const p of pipes){if(!p.passed&&p.x+48<bird.x){p.passed=true;score++;scoreEl.textContent=score;}let inX=bird.x+13>p.x&&bird.x-13<p.x+48;if(inX&&(bird.y-12<p.top||bird.y+12>p.top+p.gap)){end();return;}}
if(bird.y+14>514||bird.y-14<0){end();return;}draw();raf=requestAnimationFrame(tick);}
c.addEventListener('pointerdown',e=>{e.preventDefault();flap();});start.addEventListener('click',begin);window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap();}});reset();draw();
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
